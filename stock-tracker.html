<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Stock Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --page: #FBF7F3;
    --card: #FFFFFF;
    --line: #ECE6E0;
    --line-strong: #DCD4CC;
    --text: #1F1B18;
    --muted: #6E6660;
    --soft: #F7F3EF;
    --accent: #F06A28;          /* app bar + primary actions */
    --accent-ink: #C24E14;
    --accent-soft: #FDEBDD;
    --bar: #4F5BD5;             /* data bars */
    --bar-2: #8B95EA;
    --bar-3: #BCC2F3;
    --bar-track: #ECEEFB;
    --low: #E0484D;
    --low-soft: #FCE8E8;
    --ok: #2F8F4E;
    --ok-soft: #E5F4EA;
    --danger: #C4302B;
    --shadow: 0 1px 2px rgba(60,40,20,.04), 0 6px 20px rgba(60,40,20,.06);
    --shadow-lg: 0 2px 4px rgba(60,40,20,.05), 0 18px 40px rgba(60,40,20,.10);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-color: var(--page);
    background-image:
      radial-gradient(900px 420px at 85% -60px, rgba(247,170,120,.30), transparent 70%),
      radial-gradient(700px 380px at 5% 0%, rgba(252,214,186,.45), transparent 70%),
      linear-gradient(180deg, #FDF3EA 0%, var(--page) 420px);
    background-attachment: fixed;
  }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px 72px; }
  .spacer { flex: 1; }

  /* ---------- App bar ---------- */
  .appbar { position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 10px rgba(60,40,20,.06); }
  .topbar { background: var(--accent); color: #fff; }
  .topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; padding-bottom: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; margin-right: 12px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #fff; display: grid; place-items: center; }
  .brand-mark svg { width: 18px; height: 18px; }
  .sync { font-size: 13px; color: rgba(255,255,255,.85); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync .pip { width: 8px; height: 8px; border-radius: 50%; background: #B9F3C9; }
  .sync.busy .pip { background: #FFE2A8; }
  .sync.err .pip { background: #FFB4B0; }
  .who { font-size: 14px; color: rgba(255,255,255,.85); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .who strong { color: #fff; font-weight: 600; }
  .topbar .role { background: rgba(255,255,255,.2); color: #fff; }
  .topbar .role.admin { background: #fff; color: var(--accent-ink); }
  .topbar .btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff; padding: 7px 14px; font-size: 14px; }
  .topbar .btn:hover { background: rgba(255,255,255,.26); }
  .topbar .btn-ghost { background: transparent; border-color: transparent; }

  /* White sub-navigation row with the tabs */
  .subnav { background: var(--card); border-bottom: 1px solid var(--line); }
  .subnav .wrap { padding-bottom: 0; }
  .tabs { display: flex; gap: 4px; height: 50px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; margin-left: -14px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; padding: 0 14px; font-size: 15px; font-weight: 600;
    color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    box-shadow: inset 0 -3px 0 transparent;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); }
  .count { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
  .count.low { background: var(--low-soft); color: var(--low); }

  /* ---------- Buttons ---------- */
  .btn {
    border: 1px solid var(--line-strong); background: var(--card); border-radius: 8px;
    padding: 9px 16px; font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--soft); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(194,78,20,.25); }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--soft); color: var(--text); }

  /* ---------- Page header ---------- */
  .head { padding: 36px 0 22px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
  .head h1 { font-size: 34px; line-height: 1.15; margin: 4px 0 0; letter-spacing: -.025em; }
  .head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

  /* ---------- KPI cards ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .kpi-label { font-size: 14px; color: var(--muted); font-weight: 500; }
  .kpi-value { font-size: 34px; font-weight: 700; letter-spacing: -.03em; margin-top: 2px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi-value small { font-size: 16px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .kpi-value.low { color: var(--low); }
  .kpi-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-top: auto; padding-top: 10px; }
  .kpi-foot b { color: var(--text); font-weight: 600; white-space: nowrap; }
  .meter { height: 10px; background: var(--bar-track); border-radius: 3px; overflow: hidden; margin-top: 8px; display: flex; }
  .meter > span { display: block; height: 100%; background: var(--bar); }
  .meter > span.low { background: var(--low); }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 99px;
    padding: 7px 14px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); box-shadow: 0 1px 2px rgba(60,40,20,.04);
  }
  .chip:hover { color: var(--text); border-color: var(--line-strong); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; margin-left: auto; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* ---------- Item cards ---------- */
  .cat-title { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 30px 0 12px; }
  .cat-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .cat-title:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
    transition: box-shadow .15s, border-color .15s;
  }
  .card:hover { box-shadow: var(--shadow-lg); }
  .card.dirty { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .item-name { font-size: 17px; font-weight: 600; line-height: 1.3; }
  .item-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .badge {
    margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 6px;
    background: var(--ok-soft); color: var(--ok); text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0;
  }
  .badge.low { background: var(--low-soft); color: var(--low); }

  /* Stock level bar: fill = on hand, tick = reorder level */
  .level { display: flex; flex-direction: column; gap: 6px; }
  .level-track { position: relative; height: 12px; background: var(--bar-track); border-radius: 3px; }
  .level-fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 3px; transition: width .2s; }
  .level-fill.low { background: var(--low); }
  .level-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); border-radius: 1px; }
  .level-legend { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .level-legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-label { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--card); }
  .stepper button { width: 42px; border: none; background: var(--soft); font-size: 20px; font-weight: 500; cursor: pointer; line-height: 1; color: var(--muted); }
  .stepper button:hover { background: var(--line); color: var(--text); }
  .stepper button:disabled { opacity: .4; cursor: default; }
  .stepper input {
    width: 100%; min-width: 0; text-align: center; border: none; background: var(--card);
    font-size: 22px; font-weight: 700; padding: 6px 0; font-variant-numeric: tabular-nums;
  }
  .stepper input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .stepper input { -moz-appearance: textfield; }
  .card-foot { display: flex; align-items: center; gap: 8px; min-height: 38px; padding-top: 12px; border-top: 1px solid var(--line); }
  .note { font-size: 14px; color: var(--muted); }
  .note strong { color: var(--low); }
  .card-foot .btn { margin-left: auto; padding: 7px 14px; font-size: 14px; }
  .card-foot .btn + .btn { margin-left: 0; }

  /* ---------- Panels & tables ---------- */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font-size: 20px; letter-spacing: -.015em; }
  .panel-head p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 11px 24px; background: var(--soft); white-space: nowrap; }
  td { padding: 13px 24px; border-top: 1px solid var(--line); vertical-align: middle; }
  tbody tr:hover td { background: #FFFBF7; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.total { font-weight: 700; font-size: 18px; }
  td .sub, td.sub { font-size: 13px; color: var(--muted); }
  .dash { color: var(--line-strong); }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  .order-text { margin: 0; padding: 18px 24px; background: var(--soft); font: 14px/1.6 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre-wrap; color: var(--text); }
  .order-text-label { padding: 16px 24px 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-top: 1px solid var(--line); background: var(--soft); }
  .order-text-label + .order-text { padding-top: 8px; }

  /* Order split bar (one colour per outlet) */
  .split { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: #F1EDE8; min-width: 120px; }
  .split span { display: block; height: 100%; }
  .split span + span { box-shadow: inset 2px 0 0 #fff; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .o0 { background: var(--bar); } .o1 { background: var(--bar-2); } .o2 { background: var(--bar-3); }

  .role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); }
  .role.admin { background: var(--accent-soft); color: var(--accent-ink); }

  /* ---------- Forms ---------- */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--card); font-size: 16px;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .error { color: var(--danger); font-size: 14px; margin: -4px 0 16px; }
  .error:empty { display: none; }

  /* ---------- Sign in ---------- */
  .signin-wrap { display: grid; place-items: center; padding: 64px 0; }
  .signin-hero { text-align: center; margin-bottom: 24px; }
  .signin-hero h1 { font-size: 36px; letter-spacing: -.03em; margin: 0; line-height: 1.15; }
  .signin-hero p { color: var(--muted); margin: 8px 0 0; }
  .signin { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 30px; box-shadow: var(--shadow-lg); }
  .signin h2 { margin: 0 0 18px; font-size: 20px; }
  .signin .btn { width: 100%; padding: 12px; font-size: 16px; }

  /* ---------- Dialog ---------- */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(420px, calc(100% - 32px)); background: var(--card); color: var(--text); box-shadow: var(--shadow-lg); }
  dialog::backdrop { background: rgba(40,25,15,.4); }
  dialog h2 { margin: 0 0 4px; font-size: 20px; }
  dialog > form > p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  /* ---------- Users ---------- */
  .users-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  .panel-body { padding: 20px 24px; }
  .panel-body .btn-primary { width: 100%; padding: 12px; }
  .you { font-size: 12px; color: var(--muted); margin-left: 6px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--text); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500;
    transition: all .2s ease; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--danger); }

  .loading { padding: 80px 0; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .users-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 16px 48px; }
    .tabs { margin: 0 -16px; padding: 0 4px; }
    .tab { padding: 0 12px; }
    .topbar .wrap { min-height: 56px; gap: 8px; }
    .brand span.brand-name { display: none; }
    .sync span, .who .name-full, #changePw { display: none; }
    .head { padding-top: 24px; }
    .head h1 { font-size: 27px; }
    .kpis { gap: 10px; }
    .kpi { padding: 14px; }
    .kpi-value { font-size: 26px; }
    .grid { grid-template-columns: 1fr; }
    .toggle { margin-left: 0; }
    th, td { padding-left: 14px; padding-right: 14px; }
    .panel-head { padding: 16px; }
    .signin-hero h1 { font-size: 28px; }
  }
</style>
</head>
<body>

<header class="appbar">
<div class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F06A28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      </span>
      <span class="brand-name">Stockroom</span>
    </div>
    <div class="spacer"></div>
    <div class="sync" id="sync" hidden><span class="pip"></span><span id="syncText">Synced</span></div>
    <div class="who" id="who" hidden></div>
    <button class="btn btn-ghost" id="changePw" hidden>Change password</button>
    <button class="btn" id="signOut" hidden>Sign out</button>
  </div>
</div>
<div class="subnav" id="subnav" hidden><div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div></div>
</header>

<main class="wrap">
  <!-- Sign in -->
  <div class="signin-wrap" id="signin" hidden>
  <div class="signin-hero">
    <div class="eyebrow">Jurong · Orchard · Tampines</div>
    <h1>Stock levels for every outlet,<br>in one place.</h1>
    <p>Sign in to update counts and build the supplier order.</p>
  </div>
  <form class="signin" id="signinForm">
    <h2>Sign in</h2>
    <div class="field">
      <label for="loginUser">Username</label>
      <input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="loginPw">Password</label>
      <input id="loginPw" type="password" autocomplete="current-password" required>
    </div>
    <div class="error" id="signinError"></div>
    <button class="btn btn-primary" type="submit" id="signinBtn">Sign in</button>
  </form>
  </div>

  <div class="loading" id="loading">Loading…</div>

  <!-- App -->
  <section id="app" hidden>
    <div class="head">
      <div>
        <div class="eyebrow" id="viewEyebrow">Stock overview</div>
        <h1 id="viewTitle">All outlets</h1>
        <p id="countedAt"></p>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="refresh">Refresh</button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div id="view"></div>
  </section>
</main>

<!-- Password dialog (change own password / reset another user's) -->
<dialog id="pwDialog">
  <form method="dialog" id="pwForm">
    <h2 id="pwTitle">Change password</h2>
    <p id="pwSub"></p>
    <div class="field">
      <label for="pwNew">New password</label>
      <input id="pwNew" type="password" autocomplete="new-password" minlength="6" required>
      <div class="hint">At least 6 characters.</div>
    </div>
    <div class="field">
      <label for="pwConfirm">Confirm new password</label>
      <input id="pwConfirm" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <div class="error" id="pwError"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" id="pwCancel">Cancel</button>
      <button class="btn btn-primary" type="submit" id="pwSave">Save password</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL = 'https://mktqkopvppmwjgfnjlqn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YJkt9WKGpn3vZu3VWvELKA_05R3WJ2N';
// Users sign in with Supabase Auth; the stock table is only readable/editable when signed in
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ORDER_TAB = '__order';
const USERS_TAB = '__users';
const CATEGORY_ORDER = ['Coffee', 'Dairy', 'Powders & syrups', 'Bakery', 'Packaging', 'Other'];

const state = {
  rows: [],          // latest count per outlet + sku
  outlets: [],
  tab: null,
  category: 'All',
  lowOnly: false,
  drafts: {},        // id -> { qty, reorder }
  saving: {},        // id -> true
  user: null,        // { id, username, display_name, role }
  users: [],         // profiles, loaded for admins
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' });
const isLow = (qty, reorder) => qty <= reorder;
const shortfall = (qty, reorder) => Math.max(0, reorder - qty);

/* ---------- Toast & sync status ---------- */
let toastTimer;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), isErr ? 5000 : 2400);
}
function setSync(mode, text) {
  const s = $('sync');
  s.hidden = false;
  s.className = 'sync' + (mode ? ' ' + mode : '');
  $('syncText').textContent = text;
}

/* ---------- Auth ---------- */
// Users are stored in Supabase Auth as <username>@example.com (same rule as the manage-users function)
const toSlug = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
function toLoginEmail(input) {
  const v = input.trim();
  return v.includes('@') ? v : toSlug(v) + '@example.com';
}

async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (session) await startApp(session);
  else showSignIn();
}

function showSignIn() {
  state.user = null;
  state.drafts = {};
  state.users = [];
  $('loading').hidden = true;
  $('app').hidden = true;
  $('signin').hidden = false;
  for (const id of ['sync', 'who', 'changePw', 'signOut', 'subnav']) $(id).hidden = true;
  $('loginUser').focus();
}

$('signinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('signinError').textContent = '';
  $('signinBtn').disabled = true;
  $('signinBtn').textContent = 'Signing in…';
  const { data, error } = await db.auth.signInWithPassword({
    email: toLoginEmail($('loginUser').value),
    password: $('loginPw').value,
  });
  $('signinBtn').disabled = false;
  $('signinBtn').textContent = 'Sign in';
  if (error) {
    $('signinError').textContent = /invalid login/i.test(error.message) ? 'Wrong username or password.' : error.message;
    return;
  }
  $('loginPw').value = '';
  await startApp(data.session);
});

$('signOut').addEventListener('click', async () => {
  if (hasUnsaved() && !confirm('You have unsaved changes. Sign out anyway?')) return;
  state.drafts = {};
  await db.auth.signOut();
  showSignIn();
  toast('Signed out');
});

async function startApp(session) {
  $('signin').hidden = true;
  $('loading').hidden = false;
  $('loading').textContent = 'Loading…';

  const { data: profile } = await db.from('profiles')
    .select('id, username, display_name, role').eq('id', session.user.id).maybeSingle();
  state.user = profile || { id: session.user.id, username: session.user.email.split('@')[0], display_name: session.user.email, role: 'member' };

  const u = state.user;
  $('who').innerHTML = `<span class="name-full">Signed in as</span> <strong>${esc(u.display_name || u.username)}</strong>`
    + `<span class="role ${u.role === 'admin' ? 'admin' : ''}">${esc(u.role)}</span>`;
  for (const id of ['who', 'changePw', 'signOut', 'subnav']) $(id).hidden = false;

  await loadData();
}

db.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT' && state.user) showSignIn();
});

/* ---------- Password dialog ---------- */
function askPassword(title, sub) {
  const dlg = $('pwDialog');
  $('pwTitle').textContent = title;
  $('pwSub').textContent = sub;
  $('pwNew').value = ''; $('pwConfirm').value = ''; $('pwError').textContent = '';
  dlg.showModal();
  return new Promise((resolve) => {
    const done = (val) => {
      $('pwForm').removeEventListener('submit', onSubmit);
      $('pwCancel').removeEventListener('click', onCancel);
      dlg.removeEventListener('cancel', onCancel);
      dlg.close();
      resolve(val);
    };
    const onSubmit = (e) => {
      e.preventDefault();
      if ($('pwNew').value !== $('pwConfirm').value) { $('pwError').textContent = "Passwords don't match."; return; }
      done($('pwNew').value);
    };
    const onCancel = (e) => { e.preventDefault(); done(null); };
    $('pwForm').addEventListener('submit', onSubmit);
    $('pwCancel').addEventListener('click', onCancel);
    dlg.addEventListener('cancel', onCancel);
  });
}

$('changePw').addEventListener('click', async () => {
  const pw = await askPassword('Change your password', 'You will stay signed in on this device.');
  if (!pw) return;
  const { error } = await db.auth.updateUser({ password: pw });
  if (error) toast('Password not changed: ' + error.message, true);
  else toast('Your password has been changed');
});

/* ---------- User management (admins) ---------- */
async function callManageUsers(body) {
  const { data, error } = await db.functions.invoke('manage-users', { body });
  if (error) {
    // Pull the function's own error message out of the response when there is one
    let msg = error.message;
    try { const j = await error.context.json(); if (j?.error) msg = j.error; } catch {}
    return { error: msg };
  }
  return { data };
}

async function loadUsers() {
  const { data, error } = await db.from('profiles')
    .select('id, username, display_name, role, created_at').order('created_at');
  if (error) { toast('Could not load users: ' + error.message, true); return; }
  state.users = data;
}

function renderUsers() {
  const rows = state.users.map(u => `
    <tr>
      <td><div>${esc(u.display_name || u.username)}${u.id === state.user.id ? '<span class="you">(you)</span>' : ''}</div></td>
      <td>${esc(u.username)}</td>
      <td><span class="role ${u.role === 'admin' ? 'admin' : ''}">${esc(u.role)}</span></td>
      <td class="sub">${new Date(u.created_at).toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
      <td class="num"><button class="btn" data-reset="${esc(u.id)}" data-name="${esc(u.display_name || u.username)}">Reset password</button></td>
    </tr>`).join('');

  $('view').innerHTML = `
    <div class="users-layout">
      <form class="panel" id="addUser" autocomplete="off">
        <div class="panel-head"><div><h2>Add user</h2><p>They sign in with the username shown below.</p></div></div>
        <div class="panel-body">
          <div class="field">
            <label for="nuName">Name</label>
            <input id="nuName" type="text" maxlength="40" required>
            <div class="hint" id="nuUsername">Username: –</div>
          </div>
          <div class="field">
            <label for="nuPw">Initial password</label>
            <input id="nuPw" type="text" minlength="6" required autocomplete="off">
            <div class="hint">At least 6 characters. Ask them to change it after signing in.</div>
          </div>
          <div class="field">
            <label for="nuRole">Role</label>
            <select id="nuRole">
              <option value="member">Member: view and update stock</option>
              <option value="admin">Admin: also manage users</option>
            </select>
          </div>
          <div class="error" id="nuError"></div>
          <button class="btn btn-primary" type="submit" id="nuSubmit">Add user</button>
        </div>
      </form>

      <div class="panel">
        <div class="panel-head"><div><h2>Users</h2><p>${state.users.length} people can sign in.</p></div></div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Added</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  $('nuName').addEventListener('input', () => {
    const slug = toSlug($('nuName').value);
    $('nuUsername').textContent = 'Username: ' + (slug || '–');
  });

  $('addUser').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('nuError').textContent = '';
    $('nuSubmit').disabled = true; $('nuSubmit').textContent = 'Adding…';
    const res = await callManageUsers({
      action: 'create', name: $('nuName').value, password: $('nuPw').value, role: $('nuRole').value,
    });
    $('nuSubmit').disabled = false; $('nuSubmit').textContent = 'Add user';
    if (res.error) { $('nuError').textContent = res.error; return; }
    toast(`Added ${res.data.username}. They can sign in now.`);
    await loadUsers();
    renderUsers();
  });
}

async function resetPassword(id, name) {
  const pw = await askPassword('Reset password', `Set a new password for ${name}.`);
  if (!pw) return;
  const res = await callManageUsers({ action: 'reset_password', id, password: pw });
  if (res.error) toast('Password not reset: ' + res.error, true);
  else toast(`Password reset for ${name}`);
}

/* ---------- Data ---------- */
async function loadData() {
  setSync('busy', 'Loading…');
  const { data, error } = await db
    .from('stock_counts')
    .select('id, outlet, sku, item_name, unit, category, qty_on_hand, reorder_level, counted_at')
    .order('counted_at', { ascending: false });

  if (error) {
    $('loading').textContent = 'Could not load stock: ' + error.message;
    setSync('err', 'Error');
    return;
  }

  // Keep only the latest count per outlet + SKU
  const latest = new Map();
  for (const r of data) {
    const key = r.outlet + '|' + r.sku;
    if (!latest.has(key)) latest.set(key, { ...r, category: r.category || 'Other' });
  }
  state.rows = [...latest.values()].sort((a, b) => a.sku.localeCompare(b.sku));
  state.outlets = [...new Set(state.rows.map(r => r.outlet))].sort();
  const isAdmin = state.user?.role === 'admin';
  const validTab = state.tab === ORDER_TAB || (state.tab === USERS_TAB && isAdmin) || state.outlets.includes(state.tab);
  if (!validTab) state.tab = state.outlets[0] || ORDER_TAB;

  // Drop drafts for rows that no longer exist
  for (const id of Object.keys(state.drafts)) if (!state.rows.some(r => String(r.id) === id)) delete state.drafts[id];

  if (isAdmin) await loadUsers();

  $('loading').hidden = true;
  $('app').hidden = false;
  setSync('', 'Synced');
  render();
}

$('refresh').addEventListener('click', () => {
  if (hasUnsaved() && !confirm('Refreshing keeps your unsaved edits, but values from the database may have changed. Continue?')) return;
  loadData();
});

/* ---------- Derived values ---------- */
function current(r) {
  const d = state.drafts[r.id];
  return d ? d : { qty: r.qty_on_hand, reorder: r.reorder_level };
}
function hasUnsaved() { return Object.keys(state.drafts).length > 0; }

function orderLines() {
  const bySku = new Map();
  for (const r of state.rows) {
    const need = shortfall(r.qty_on_hand, r.reorder_level);
    if (!bySku.has(r.sku)) bySku.set(r.sku, { sku: r.sku, name: r.item_name, unit: r.unit, category: r.category, per: {}, total: 0 });
    const line = bySku.get(r.sku);
    line.per[r.outlet] = need;
    line.total += need;
  }
  return [...bySku.values()].filter(l => l.total > 0).sort((a, b) => b.total - a.total || a.sku.localeCompare(b.sku));
}

/* ---------- Rendering ---------- */
const isOutletTab = () => state.outlets.includes(state.tab);

function render() {
  renderKpis();
  renderTabs();
  if (state.tab === ORDER_TAB) renderOrders();
  else if (state.tab === USERS_TAB) renderUsers();
  else renderOutlet(state.tab);

  const [eyebrow, title] =
    state.tab === ORDER_TAB ? ['Purchasing', 'Order from suppliers'] :
    state.tab === USERS_TAB ? ['Admin', 'Users'] :
    ['Outlet stock', state.tab];
  $('viewEyebrow').textContent = eyebrow;
  $('viewTitle').textContent = title;
  $('kpis').hidden = state.tab === USERS_TAB;
  $('refresh').hidden = state.tab === USERS_TAB;

  const dates = [...new Set(state.rows.map(r => r.counted_at))].sort();
  $('countedAt').textContent = dates.length ? 'Latest count: ' + dates.map(fmtDate).join(', ') : 'No stock counts yet';
}

// KPI cards cover the open outlet, or all outlets on the order tab
function renderKpis() {
  const rows = isOutletTab() ? state.rows.filter(r => r.outlet === state.tab) : state.rows;
  const scope = isOutletTab() ? state.tab : 'all outlets';
  const total = rows.length || 1;
  const low = rows.filter(r => isLow(r.qty_on_hand, r.reorder_level)).length;
  const okPct = Math.round(((rows.length - low) / total) * 100);
  const lowPct = Math.round((low / total) * 100);
  const out = rows.filter(r => r.qty_on_hand === 0).length;
  const toOrder = rows.reduce((s, r) => s + shortfall(r.qty_on_hand, r.reorder_level), 0);
  const lines = rows.filter(r => shortfall(r.qty_on_hand, r.reorder_level) > 0).length;
  const onHand = rows.reduce((s, r) => s + r.qty_on_hand, 0);

  $('kpis').innerHTML = `
    <div class="kpi">
      <div class="kpi-label">Stock health</div>
      <div class="kpi-value">${okPct}<small>%</small></div>
      <div class="meter"><span style="width:${okPct}%"></span></div>
      <div class="kpi-foot"><span>Above reorder level</span><b>${rows.length - low} of ${rows.length}</b></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Low stock</div>
      <div class="kpi-value low">${low}</div>
      <div class="meter"><span class="low" style="width:${lowPct}%"></span></div>
      <div class="kpi-foot"><span>At or below reorder</span><b>${lowPct}%</b></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Units on hand</div>
      <div class="kpi-value">${onHand}</div>
      <div class="kpi-foot"><span>Out of stock</span><b>${out} item${out === 1 ? '' : 's'}</b></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Units to order</div>
      <div class="kpi-value">${toOrder}</div>
      <div class="kpi-foot"><span>${esc(scope)}</span><b>${lines} line${lines === 1 ? '' : 's'}</b></div>
    </div>`;
}

function renderTabs() {
  const tabs = state.outlets.map(o => {
    const low = state.rows.filter(r => r.outlet === o && isLow(r.qty_on_hand, r.reorder_level)).length;
    return `<button class="tab" role="tab" data-tab="${esc(o)}" aria-selected="${state.tab === o}">${esc(o)}<span class="count ${low ? 'low' : ''}">${low} low</span></button>`;
  });
  const lines = orderLines().length;
  tabs.push(`<button class="tab" role="tab" data-tab="${ORDER_TAB}" aria-selected="${state.tab === ORDER_TAB}">Order from suppliers<span class="count ${lines ? 'low' : ''}">${lines}</span></button>`);
  if (state.user?.role === 'admin') {
    tabs.push(`<button class="tab" role="tab" data-tab="${USERS_TAB}" aria-selected="${state.tab === USERS_TAB}">Users<span class="count">${state.users.length}</span></button>`);
  }
  $('tabs').innerHTML = tabs.join('');
}

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if (!b) return;
  state.tab = b.dataset.tab;
  render();
});

function renderOutlet(outlet) {
  const rows = state.rows.filter(r => r.outlet === outlet);
  const cats = CATEGORY_ORDER.filter(c => rows.some(r => r.category === c))
    .concat([...new Set(rows.map(r => r.category))].filter(c => !CATEGORY_ORDER.includes(c)).sort());
  if (state.category !== 'All' && !cats.includes(state.category)) state.category = 'All';

  const chips = ['All', ...cats].map(c => {
    const n = c === 'All' ? rows.length : rows.filter(r => r.category === c).length;
    return `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.category === c}">${esc(c)} · ${n}</button>`;
  }).join('');

  let visible = rows.filter(r => state.category === 'All' || r.category === state.category);
  if (state.lowOnly) visible = visible.filter(r => { const c = current(r); return isLow(c.qty, c.reorder) || state.drafts[r.id]; });

  const groups = cats.filter(c => visible.some(r => r.category === c)).map(c => `
    <div class="cat-title">${esc(c)}</div>
    <div class="grid">${visible.filter(r => r.category === c).map(cardHtml).join('')}</div>`).join('');

  $('view').innerHTML = `
    <div class="filters">
      ${chips}
      <label class="toggle"><input type="checkbox" id="lowOnly" ${state.lowOnly ? 'checked' : ''}> Low items only</label>
    </div>
    ${groups || '<div class="panel"><div class="empty"><strong>Nothing low here</strong>Every item in this view is above its reorder level.</div></div>'}`;
}

function cardHtml(r) {
  const c = current(r);
  const low = isLow(c.qty, c.reorder);
  const dirty = !!state.drafts[r.id];
  const saving = !!state.saving[r.id];
  const need = shortfall(c.qty, c.reorder);
  const ro = '';
  let note;
  if (c.qty === 0) note = `<span class="note"><strong>Out of stock</strong> · order ${need}</span>`;
  else if (need > 0) note = `<span class="note"><strong>${need} short</strong> of reorder level</span>`;
  else if (low) note = `<span class="note"><strong>At reorder level</strong></span>`;
  else note = `<span class="note">${c.qty - c.reorder} above reorder level</span>`;

  // Bar scale leaves room above the reorder level so the tick sits mid-bar
  const scale = Math.max(c.qty, c.reorder * 2, 1);
  const fillPct = Math.min(100, (c.qty / scale) * 100);
  const tickPct = Math.min(100, (c.reorder / scale) * 100);

  return `
  <article class="card ${low ? 'is-low' : ''} ${dirty ? 'dirty' : ''}" data-id="${r.id}">
    <div class="card-top">
      <div>
        <div class="item-name">${esc(r.item_name)}</div>
        <div class="item-meta">${esc(r.sku)} · per ${esc(r.unit)}</div>
      </div>
      <span class="badge ${low ? 'low' : ''}">${low ? 'Low' : 'OK'}</span>
    </div>
    <div class="level" title="On hand ${c.qty} · reorder at ${c.reorder}">
      <div class="level-track">
        <div class="level-fill ${low ? 'low' : ''}" style="width:${fillPct}%"></div>
        <div class="level-tick" style="left:calc(${tickPct}% - 1px)"></div>
      </div>
      <div class="level-legend"><span>On hand <b>${c.qty}</b></span><span>Reorder at <b>${c.reorder}</b></span></div>
    </div>
    <div class="fields">
      <div>
        <div class="field-label">On hand</div>
        <div class="stepper">
          <button data-act="dec" data-field="qty" aria-label="Remove one ${esc(r.item_name)}" ${ro || (c.qty <= 0 ? 'disabled' : '')}>−</button>
          <input type="number" min="0" inputmode="numeric" data-field="qty" value="${c.qty}" aria-label="${esc(r.item_name)} on hand" ${ro}>
          <button data-act="inc" data-field="qty" aria-label="Add one ${esc(r.item_name)}" ${ro}>+</button>
        </div>
      </div>
      <div>
        <div class="field-label">Reorder level</div>
        <div class="stepper">
          <button data-act="dec" data-field="reorder" aria-label="Lower reorder level" ${ro || (c.reorder <= 0 ? 'disabled' : '')}>−</button>
          <input type="number" min="0" inputmode="numeric" data-field="reorder" value="${c.reorder}" aria-label="${esc(r.item_name)} reorder level" ${ro}>
          <button data-act="inc" data-field="reorder" aria-label="Raise reorder level" ${ro}>+</button>
        </div>
      </div>
    </div>
    <div class="card-foot">
      ${note}
      ${dirty ? `<button class="btn btn-ghost" data-act="reset" ${saving ? 'disabled' : ''}>Undo</button>
                 <button class="btn btn-primary" data-act="save" ${saving ? 'disabled' : ''}>${saving ? 'Saving…' : 'Save'}</button>` : ''}
    </div>
  </article>`;
}

function setDraft(r, field, value) {
  const c = { ...current(r) };
  c[field] = Math.max(0, Math.floor(Number(value) || 0));
  if (c.qty === r.qty_on_hand && c.reorder === r.reorder_level) delete state.drafts[r.id];
  else state.drafts[r.id] = c;
}

// Re-render one card in place so typing focus isn't lost elsewhere
function refreshCard(id) {
  const r = state.rows.find(x => x.id === id);
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (!r || !el) return;
  el.outerHTML = cardHtml(r);
}

$('view').addEventListener('click', async (e) => {
  const reset = e.target.closest('button[data-reset]');
  if (reset) { await resetPassword(reset.dataset.reset, reset.dataset.name); return; }

  const chip = e.target.closest('.chip');
  if (chip) { state.category = chip.dataset.cat; render(); return; }

  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = Number(btn.closest('.card').dataset.id);
  const r = state.rows.find(x => x.id === id);
  const act = btn.dataset.act;

  if (act === 'inc' || act === 'dec') {
    const f = btn.dataset.field;
    setDraft(r, f, current(r)[f] + (act === 'inc' ? 1 : -1));
    refreshCard(id);
  } else if (act === 'reset') {
    delete state.drafts[id];
    refreshCard(id);
  } else if (act === 'save') {
    await save(r);
  }
});

$('view').addEventListener('change', (e) => {
  if (e.target.id === 'lowOnly') { state.lowOnly = e.target.checked; render(); return; }
  const input = e.target.closest('input[data-field]');
  if (!input) return;
  const id = Number(input.closest('.card').dataset.id);
  setDraft(state.rows.find(x => x.id === id), input.dataset.field, input.value);
  refreshCard(id);
});

$('view').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input[data-field]')) e.target.blur();
});

async function save(r) {
  const d = state.drafts[r.id];
  if (!d) return;
  state.saving[r.id] = true;
  refreshCard(r.id);
  setSync('busy', 'Saving…');

  const { data, error } = await db
    .from('stock_counts')
    .update({ qty_on_hand: d.qty, reorder_level: d.reorder })
    .eq('id', r.id)
    .select('id, qty_on_hand, reorder_level');

  delete state.saving[r.id];

  if (error || !data || data.length === 0) {
    const msg = error ? 'Not saved: ' + error.message : 'Not saved: your session may have expired. Sign out and sign in again.';
    toast(msg, true);
    setSync('err', 'Save failed');
    refreshCard(r.id);
    return;
  }

  r.qty_on_hand = data[0].qty_on_hand;
  r.reorder_level = data[0].reorder_level;
  delete state.drafts[r.id];
  setSync('', 'Synced');
  toast(`${r.item_name} saved for ${r.outlet}`);
  render();
}

function orderText(lines) {
  const date = new Date().toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' });
  const out = [`Supplier order – ${date}`, ''];
  for (const l of lines) {
    const split = state.outlets.filter(o => l.per[o] > 0).map(o => `${o} ${l.per[o]}`).join(', ');
    out.push(`${l.name} (${l.sku}): ${l.total} ${l.unit}${l.total === 1 ? '' : 's'}  [${split}]`);
  }
  out.push('', `Total: ${lines.reduce((s, l) => s + l.total, 0)} units across ${lines.length} items`);
  return out.join('\n');
}

function renderOrders() {
  const lines = orderLines();
  if (!lines.length) {
    $('view').innerHTML = `<div class="panel"><div class="empty"><strong>Nothing to order</strong>Every outlet is at or above its reorder levels.</div></div>`;
    return;
  }
  const head = state.outlets.map(o => `<th class="num">${esc(o)}</th>`).join('');
  const maxTotal = Math.max(...lines.map(l => l.total));
  const legend = state.outlets.map((o, i) => `<span><i class="o${i % 3}"></i>${esc(o)}</span>`).join('');
  const body = lines.map(l => `
    <tr>
      <td><div>${esc(l.name)}</div><div class="sub">${esc(l.sku)} · ${esc(l.category)}</div></td>
      ${state.outlets.map(o => `<td class="num">${l.per[o] > 0 ? l.per[o] : '<span class="dash">—</span>'}</td>`).join('')}
      <td class="num total">${l.total}</td>
      <td class="sub">${esc(l.unit)}${l.total === 1 ? '' : 's'}</td>
      <td style="width:28%"><div class="split" title="${state.outlets.map(o => `${o} ${l.per[o] || 0}`).join(' · ')}">
        ${state.outlets.map((o, i) => l.per[o] > 0 ? `<span class="o${i % 3}" style="width:${(l.per[o] / maxTotal) * 100}%"></span>` : '').join('')}
      </div></td>
    </tr>`).join('');
  const unsavedNote = hasUnsaved() ? ' Unsaved edits are not included until you save them.' : '';

  $('view').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>Shortfall by item</h2>
          <p>Units needed to bring each outlet back up to its reorder level.${unsavedNote}</p>
        </div>
        <div class="spacer"></div>
        <div class="legend">${legend}</div>
        <button class="btn btn-primary" id="copyOrder">Copy order list</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Item</th>${head}<th class="num">Total</th><th>Unit</th><th>Split by outlet</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <div class="order-text-label">Text that will be copied</div>
      <pre class="order-text" id="orderText">${esc(orderText(lines))}</pre>
    </div>`;

  $('copyOrder').addEventListener('click', async () => {
    const text = orderText(lines);
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('Order list copied');
  });
}

window.addEventListener('beforeunload', (e) => { if (hasUnsaved()) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
</body>
</html>
